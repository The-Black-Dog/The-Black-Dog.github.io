<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | ConnectUS Practice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E0A3C'/%3E%3Cpath d='M22 14l24 14-10 2.6L31 44z' fill='%23F8D86E' stroke='%23F8D86E' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='44' cy='46' r='6' fill='%23DCCDEB'/%3E%3C/svg%3E" type="image/svg+xml">
<style>
:root { --ink: #1E0A3C; --bg: #FFFFFF; --band: #F5F5F5; --yellow: #F8D86E; --lav: #DCCDEB; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --ink: #F1EBFA; --bg: #16101F; --band: #201830; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--ink);
  font-family: "Poppins", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 1.125rem; line-height: 1.55; }
main { max-width: 34rem; background: var(--band); border-radius: 20px; padding: 2.5rem 2rem; }
h1 { font-size: clamp(1.8rem, 1.4rem + 1.5vw, 2.4rem); line-height: 1.15; margin: 0 0 .75rem; }
p { margin: 0 0 1rem; }
.note { background: var(--yellow); color: #1E0A3C; border-radius: 12px; padding: .9rem 1.1rem; font-weight: 700; }
a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: .7rem 1.4rem; margin-top: .5rem; border-radius: 6px;
  border: 2px solid #1E0A3C; background: var(--lav); color: #1E0A3C; font-weight: 700; text-decoration: none; }
a.btn:hover { text-decoration: underline; }
a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>We couldn’t find that page</h1>
  <p>The link may have a typo, or the page may have moved. That happens on real websites too.</p>
  <p class="note">Tip: when a page can’t be found, go back to the website’s home page and look for it from there.</p>
  <a class="btn" href="/">Go to the practice home page</a>
</main>
</body>
</html>
